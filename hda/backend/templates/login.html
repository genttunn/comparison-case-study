<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDA Task Tracker — Login</title>
  <link rel="stylesheet" href="/shared/styles.css" />
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h2>Sign in</h2>
      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>

    <div class="cred-panel">
      <h3>Demo credentials</h3>
      <table class="cred-table">
        <thead>
          <tr><th>Username</th><th>Password</th><th>Role</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>alice</td><td>alice123</td>
            <td><span class="cred-tag">admin</span></td>
          </tr>
          <tr>
            <td>bob</td><td>bob123</td>
            <td><span class="cred-tag" style="background:var(--text-muted)">user</span></td>
          </tr>
          <tr>
            <td>levi</td><td>levi123</td>
            <td><span class="cred-tag" style="background:#c0392b">attacker</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()">
    <span id="theme-label"></span>
  </button>
  <script>
    (function () {
      var label = document.getElementById('theme-label');
      label.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀ Light' : '☾ Dark';
    })();
    function toggleTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-label').textContent = isDark ? '☾ Dark' : '☀ Light';
    }
  </script>
</body>
</html>
