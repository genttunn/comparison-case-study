<li style="border:1px solid var(--border);border-radius:4px;padding:10px 12px">
  <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">
    <strong>{{ comment.username }}</strong> &mdash; {{ comment.created_at }}
  </div>
  {# Jinja2 auto-escapes {{ comment.body }} — structural XSS mitigation, no sanitization needed #}
  <div>{{ comment.body }}</div>
</li>
